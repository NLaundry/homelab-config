schema: spec-driven-governed

# Permanent truth planes for this homelab. Every durable fact has one owning
# plane; initiatives may legitimately change several peer planes.
specModel:
  planes:
    - id: service
      purpose: >-
        Steady-state outcomes directly observed by people, administrators,
        devices, and client services: reachable capabilities, protocol results,
        authorization outcomes, errors, and externally meaningful state.
      enforcementFlavor: protocol tests / property tests / bounded live probes / honest review
      reviewLens: service
    - id: estate
      purpose: >-
        The desired homelab graph: sites, hosts, roles, workload placement,
        dependencies, state ownership, authorities, trust boundaries, and failure
        domains.
      enforcementFlavor: evaluated graph properties / reconciliation / topology review
      reviewLens: estate
    - id: configuration
      purpose: >-
        Proposal-worthy realization choices: selected products, versions, NixOS
        options, addresses, listeners, mounts, identities, groups, ACLs, schedules,
        and firewall realization.
      enforcementFlavor: Nix evaluation / closure builds / VM composition / configuration audit
      reviewLens: configuration
    - id: lifecycle
      purpose: >-
        Durable guarantees whose meaning depends on time, an event, or a
        transition, including boot, deploy, update, rollback, revocation, backup,
        restore, failover, and recovery.
      enforcementFlavor: transition tests / fault injection / bounded drills / manual evidence
      reviewLens: lifecycle
    - id: governance
      purpose: >-
        The repository and control machinery that declares, builds, tests,
        reviews, and deploys the estate, including Nix and IaC conventions,
        Specbase workflow, evidence quality, CI, operator tooling, and repo-owned
        agent instruments.
      enforcementFlavor: deterministic conformance / mutation tests / semantic review
      reviewLens: governance

context: |
  This repository declares and operates a homelab through Specbase, Nix, and
  infrastructure as code. Classify individual normative claims, not whole
  initiatives or products. One initiative may touch several peer planes, but
  each durable fact has exactly one owning plane.

  Split compound claims, then classify in this order:
  1. Repository, testing, review, deployment-control, or agent machinery is Governance.
  2. A fact whose meaning requires time, an event, or a transition is Lifecycle.
  3. A steady-state outcome observed by a person, device, or client is Service.
  4. A site, node, role, placement, dependency, authority, boundary, ownership,
     or failure-domain fact is Estate.
  5. A selected product, value, version, address, listener, mount, account,
     group, ACL, schedule, firewall rule, or declarative mechanism is Configuration.

  Use one-truth-one-plane: reference another plane's fact by locator and never
  restate it. Moving a workload changes Estate unless its selected realization
  also changes. Replacing a product while preserving outcomes and topology
  changes Configuration only. Authorization outcomes are Service; authorities
  and trust boundaries are Estate; groups, ACLs, and certificate settings are
  Configuration; rotation and revocation are Lifecycle; repository secret
  controls are Governance.

  Match evidence to the owning truth. Prefer evaluated Nix, graph properties,
  closure builds, isolated VM behavior, protocol-native probes, fault injection,
  and recovery drills. Do not substitute source grep when evaluation is
  available, script-existence checks for behavior, wrapper success for child
  assertions, or tests created only to improve coverage. Record review/manual
  limitations honestly when physical or transition truth cannot be automated.
