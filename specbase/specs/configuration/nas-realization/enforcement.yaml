bindings:
  nas-evaluated-configuration:
    type: command
    covers:
      - zfs-pool-import-configuration
      - zfs-host-identity-stable
      - force-import-root-disabled
    source: tests/specbase/current-bindings.sh#nas-configuration
  kernel-zfs-projection:
    type: command
    covers: zfs-kernel-compatible
    source: tests/specbase/current-bindings.sh#kernel-zfs-projection
  managed-host-closure:
    type: command
    covers: zfs-kernel-compatible
    source: tests/specbase/current-bindings.sh#managed-host-closure
  operator-evaluated-configuration:
    type: command
    covers: operator-account-configuration
    source: tests/specbase/current-bindings.sh#operator-configuration
