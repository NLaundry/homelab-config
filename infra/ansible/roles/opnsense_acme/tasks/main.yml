---
- name: Read the commissioned ACME identities
  oxlorg.opnsense.raw:
    url: "acmeclient/{{ acme_identity.endpoint }}"
    action: get
  loop:
    - {key: account, endpoint: accounts/search}
    - {key: validation, endpoint: validations/search}
    - {key: action, endpoint: actions/search}
    - {key: certificate, endpoint: certificates/search}
  loop_control:
    loop_var: acme_identity
  register: acme_identity_search
  changed_when: false

- name: Require ACME bootstrap before creating missing identities
  ansible.builtin.assert:
    that:
      - >-
        (acme_identity_search.results[0].response.rows
        | selectattr('name', 'equalto', opnsense_acme.account_name) | list | length) == 1
      - >-
        (acme_identity_search.results[1].response.rows
        | selectattr('name', 'equalto', opnsense_acme.challenge_name) | list | length) == 1
      - >-
        (acme_identity_search.results[2].response.rows
        | selectattr('name', 'equalto', opnsense_acme.automation_name) | list | length) == 1
      - >-
        (acme_identity_search.results[3].response.rows
        | selectattr('description', 'equalto', opnsense_acme.certificate_description) | list | length) == 1
    fail_msg: ACME is not commissioned. Run opnsense-acme-bootstrap.yml before routine configuration.

- name: Configure the native ACME client
  oxlorg.opnsense.acme_general:
    enabled: true
    auto_renewal: true
  register: acme_general

- name: Configure the internal CA account without registering it
  oxlorg.opnsense.acme_account:
    name: "{{ opnsense_acme.account_name }}"
    description: "{{ opnsense_acme.account_description }}"
    ca: custom
    custom_ca: "{{ opnsense_acme.directory }}"
    register: false
    state: present
    reload: false
  register: acme_account

- name: Configure the LAN HTTP-01 validation
  oxlorg.opnsense.acme_validation:
    name: "{{ opnsense_acme.challenge_name }}"
    description: "{{ opnsense_acme.challenge_description }}"
    method: http01
    http_service: opnsense
    http_opn_autodiscovery: false
    http_opn_ipaddresses:
      - "{{ opnsense_acme.challenge_address }}"
    state: present
    reload: false
  register: acme_validation

- name: Configure the WebGUI reload action
  oxlorg.opnsense.acme_action:
    name: "{{ opnsense_acme.automation_name }}"
    type: configd_restart_gui
    state: present
    reload: false
  register: acme_action

- name: Configure the commissioned router certificate
  oxlorg.opnsense.acme_certificate:
    name: "{{ opnsense_acme.hostname }}"
    description: "{{ opnsense_acme.certificate_description }}"
    account: "{{ opnsense_acme.account_name }}"
    validation: "{{ opnsense_acme.challenge_name }}"
    restart_actions:
      - "{{ opnsense_acme.automation_name }}"
    auto_renewal: true
    renew_interval: "{{ opnsense_acme.renew_interval }}"
    state: present
    reload: false
  register: acme_certificate

- name: Configure the native renewal schedule
  oxlorg.opnsense.cron:
    description: "{{ opnsense_acme.schedule.description }}"
    command: acmeclient cron-auto-renew
    minutes: "{{ opnsense_acme.schedule.minutes }}"
    hours: "{{ opnsense_acme.schedule.hours }}"
    days: "{{ opnsense_acme.schedule.days }}"
    months: "{{ opnsense_acme.schedule.months }}"
    weekdays: "{{ opnsense_acme.schedule.weekdays }}"
    who: "{{ opnsense_acme.schedule.who }}"
    state: present
    reload: false
  register: acme_schedule

- name: Reconfigure the native ACME service after routine changes
  oxlorg.opnsense.raw:
    url: acmeclient/service/reconfigure
    action: post
  register: acme_reconfigured
  failed_when: not ansible_check_mode and acme_reconfigured.response.status | default('') | trim | lower != 'ok'
  when: acme_general.changed or acme_account.changed or acme_validation.changed or acme_action.changed or acme_certificate.changed or acme_schedule.changed
