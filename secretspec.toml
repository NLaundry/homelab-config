[project]
name = "homelab-config"
revision = "1.0"

[providers]
network = "sops://secrets/network.yaml?sops_config=.sops.yaml"

[profiles.north_york.defaults]
providers = ["network"]
required = true

[profiles.north_york]
NB_PAT = { description = "NetBird management token", ref = { item = "netbird" }, extract = { format = "json", pointer = "/pat" } }
NB_MANAGEMENT_URL = { description = "NetBird management endpoint", ref = { item = "netbird" }, extract = { format = "json", pointer = "/management_url" } }
TF_VAR_state_encryption_passphrase = { description = "OpenTofu state and plan encryption passphrase", ref = { item = "opentofu" }, extract = { format = "json", pointer = "/state_encryption_passphrase" } }
OPNSENSE_URL = { description = "OPNsense HTTPS endpoint", ref = { item = "opnsense" }, extract = { format = "json", pointer = "/url" } }
OPNSENSE_API_KEY = { description = "OPNsense API key", ref = { item = "opnsense" }, extract = { format = "json", pointer = "/api_key" } }
OPNSENSE_API_SECRET = { description = "OPNsense API secret", ref = { item = "opnsense" }, extract = { format = "json", pointer = "/api_secret" } }

[scopes.opentofu]
secrets = ["NB_PAT", "NB_MANAGEMENT_URL", "TF_VAR_state_encryption_passphrase"]

[scopes.opnsense]
secrets = ["OPNSENSE_URL", "OPNSENSE_API_KEY", "OPNSENSE_API_SECRET"]
