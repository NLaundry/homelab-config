schema: spec-driven

context: |
  This repository manages a NixOS NAS and an Ansible fleet.
  Prefer the smallest useful change. Use OpenSpec for substantial planned work, not every edit.
  Specs describe important behavior and constraints, not copies of configuration values.
  Use concise Simplified Technical English. Test real behavior and concrete failure risks.
  Do not add evidence registries, paired enforcement, review panels, or tests of documentation.
  ideas/ and stacks/ are manual planning folders. Follow stack member order; OpenSpec does not enforce it.
  Imported plans retain historical commands and enforcement tasks. Reconcile them with today's
  Makefile and agent guidance before applying; do not recreate removed machinery.
  Live activation and state-changing probes need explicit user authorization.
