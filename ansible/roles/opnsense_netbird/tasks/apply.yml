---
- name: Apply saved routing separately from configuration differences
  when:
    - apply_routing | bool
    - not ansible_check_mode
  block:
    - name: Sync changed settings or explicitly retry the previous failed sync
      oxlorg.opnsense.raw:
        url: netbird/settings/sync
        action: post
        timeout: 120
      register: synced
      failed_when: synced.response.result | default('') != 'synced'
      when: settings_differ | bool or reapply_routing | bool

    - name: Apply every staged NetBird rule together
      oxlorg.opnsense.raw:
        url: firewall/filter/apply
        action: post
        timeout: 120
      register: netbird_firewall_applied
      failed_when: netbird_firewall_applied.response.status | default('') | trim | lower != 'ok'
      when: netbird_firewall_needed | bool or reapply_routing | bool

    - name: Verify the runtime NetBird service
      oxlorg.opnsense.raw:
        url: netbird/service/status
        action: get
      register: netbird_service
      changed_when: false
      failed_when: netbird_service.response.status | default('') != 'running'

    - name: Verify runtime management connectivity after application
      oxlorg.opnsense.raw:
        url: netbird/status/status
        action: get
      register: netbird_peer
      changed_when: false
      failed_when: not (netbird_peer.response.management.connected | default(false) | bool)

    - name: Record selected runtime health separately from routed acceptance
      ansible.builtin.set_fact:
        netbird_runtime_verified: true
  rescue:
    - name: Report incomplete routing activation without response data
      ansible.builtin.fail:
        msg: Saved routing may differ from runtime. Correct the failure, then retry with apply_routing=true reapply_routing=true. Off-LAN routed access remains a separate acceptance check.
      no_log: false
