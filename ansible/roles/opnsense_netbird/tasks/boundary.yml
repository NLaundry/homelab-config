---
# Approved official-guide boundary: NetBird ACLs govern overlay access.
# DNS listener changes never remove this rule or control its lifecycle.
- name: Read the approved NetBird interface assignment
  oxlorg.opnsense.raw:
    url: "interfaces/assignment/get_item/{{ opnsense_netbird_interface }}"
    action: get
  register: netbird_assignment
  changed_when: false
  no_log: true

- name: Require the recorded locked wt0 assignment
  ansible.builtin.assert:
    that:
      - opnsense_netbird_interface is match('^opt[0-9]+$')
      - netbird_assignment.response.interface.descr == 'NetBird'
      - netbird_assignment.response.interface.lock == '1'
      - netbird_assignment.response.interface['if'].wt0.selected | int == 1
    fail_msg: Use the normal UI to assign, enable and lock wt0 with IPv4/IPv6 None; do not guess an opt interface identifier.
  no_log: true

- name: Require enabled state from the native assignment field when available
  ansible.builtin.assert:
    that:
      - netbird_assignment.response.interface.enable == '1'
  when: netbird_assignment.response.interface.enable is defined
  no_log: true

# Older assignment APIs omit enable. Routing then requires the already-granted
# page-diagnostics-configurationhistory privilege (Diagnostics: Configuration
# History). It also authorizes destructive core/backup methods; use only this GET.
# Config.php saves the current file before making the latest history backup.
- name: Verify enabled state from saved configuration only when the API omits it
  when: netbird_assignment.response.interface.enable is not defined
  no_log: true
  block:
    - name: Read saved configuration into memory without writing a local backup
      ansible.builtin.uri:
        url: "{{ opnsense_url }}/api/core/backup/download/this"
        method: GET
        url_username: "{{ opnsense_api_key }}"
        url_password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        ca_path: "{{ opnsense_ca_file }}"
        validate_certs: true
        use_proxy: false
        unredirected_headers: [Authorization]
        follow_redirects: none
        return_content: true
        status_code: 200
      register: netbird_saved_config
      check_mode: false
      changed_when: false
      no_log: true

    - name: Require unambiguous enabled and locked saved NetBird identity
      ansible.builtin.assert:
        that:
          - netbird_saved_config.content | netbird_saved_interface_enabled(opnsense_netbird_interface)
      no_log: true
  rescue:
    - name: Report only the bounded saved-interface validation failure
      ansible.builtin.fail:
        msg: >-
          Cannot verify the enabled and locked NetBird wt0 assignment from saved
          configuration. This assignment API omits enable; routing requires GET
          core/backup/download/this with Diagnostics: Configuration History access
          and an unambiguous enabled saved assignment. No enabled default is used.
      no_log: false
  always:
    - name: Discard the private saved configuration response
      ansible.builtin.set_fact:
        netbird_saved_config: {}
      no_log: true

- name: Compare or stage the approved NetBird-managed IPv4 access boundary
  oxlorg.opnsense.rule:
    description: Allow all on NetBird (managed by NetBird)
    match_fields: [description]
    sequence: 1
    interface: ["{{ opnsense_netbird_interface }}"]
    direction: in
    action: pass
    quick: true
    ip_protocol: inet
    protocol: any
    source_net: any
    source_port: ''
    destination_net: any
    destination_port: ''
    log: false
    enabled: true
    state: present
    reload: false
  check_mode: "{{ not (apply_routing | bool) or ansible_check_mode or netbird_verify | default(false) | bool }}"
  register: netbird_rule_result
