---
# DNS-only fallback by default. Keep DHCP enable state and the lease database.
# Explicit dns_stop_for_isc additionally requires confirmed rollback readiness;
# restoring ISC itself remains a lease-reconciled normal-UI operation.
- name: Require explicit approval for DNS-only recovery
  ansible.builtin.assert:
    that:
      - apply_dns | bool
      - not (cutover_dns | bool)
      - opnsense_dns_site_id == 'north_york'
      - opnsense_dns_approved_site_data is sameas true
      - dns_local_recovery_ready | default(false) is sameas true
      - not (dns_stop_for_isc | default(false) | bool) or (dns_isc_rollback_ready | default(false) is sameas true)

- name: Read the prior Dnsmasq service state over the recovery transport
  ansible.builtin.include_tasks: control.yml
  vars:
    dns_control:
      path: dnsmasq/service/status
      method: GET
      field: status
      expected_values: [disabled, stopped, running]
  when: not ansible_check_mode

- name: Retain the prior DHCP enable expectation
  ansible.builtin.set_fact:
    dns_recovery_expected_status: "{{ 'disabled' if dns_stop_for_isc | default(false) | bool or (dns_control_result.stdout | from_json).status == 'disabled' else 'running' }}"
  when: not ansible_check_mode

- name: Release DNS port 53 and restore Unbound without restarting ISC
  ansible.builtin.include_tasks: control.yml
  loop:
    - path: dnsmasq/settings/set
      data:
        dnsmasq: "{{ {'port': '0'} | combine({'enable': '0'} if dns_stop_for_isc | default(false) | bool else {}) }}"
      field: result
      expected: saved
    - {path: dnsmasq/service/reconfigure, field: status, expected: ok}
    - {path: unbound/settings/set, data: {unbound: {general: {enabled: '1'}}}, field: result, expected: saved}
    - {path: unbound/service/reconfigure, field: status, expected: ok}
    - {path: unbound/service/status, method: GET, field: status, expected: running}
  loop_control:
    loop_var: dns_control
  when: not ansible_check_mode

# Service reconfigure can return 'ok' even when its backend restart failed.
# Check DHCP health after restoring DNS, not just the API acknowledgement.
- name: Verify Dnsmasq retained the expected DHCP service state
  ansible.builtin.include_tasks: control.yml
  vars:
    dns_control:
      path: dnsmasq/service/status
      method: GET
      field: status
      expected: "{{ dns_recovery_expected_status }}"
  when: not ansible_check_mode

- name: Report the recovery boundary without claiming lease restoration
  ansible.builtin.debug:
    msg: "{{ 'Dnsmasq is persistently disabled for ISC rollback.' if dns_stop_for_isc | default(false) | bool else 'DNS-only recovery finished; DHCP enable state was retained.' }} Verify DNS answers; reconcile the final Dnsmasq lease set before any ISC restart."
  no_log: false
  when: not ansible_check_mode
