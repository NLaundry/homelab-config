---
# Explicitly approved: this does not broaden Guest internet or LAN access.
- name: Compare or stage Guest TCP DNS to its router only
  oxlorg.opnsense.rule:
    description: homelab:north_york:guest-router-dns-tcp
    match_fields: [description]
    sequence: 100
    interface: [opt1]
    direction: in
    action: pass
    quick: true
    ip_protocol: inet
    protocol: TCP
    source_net: 10.10.20.0/24
    destination_net: 10.10.20.1
    destination_port: '53'
    log: false
    enabled: true
    state: present
    reload: false
  check_mode: "{{ not (apply_dns | bool) or ansible_check_mode or dns_verify | default(false) | bool }}"
  register: dns_guest_rule_result
