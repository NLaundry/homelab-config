---
- name: Apply saved DNS and verify selected runtime outcomes
  when:
    - apply_dns | bool
    - not ansible_check_mode
  block:
    - name: Reconfigure Dnsmasq after differences or explicit retry
      oxlorg.opnsense.raw:
        url: dnsmasq/service/reconfigure
        action: post
        timeout: 120
      register: dns_reloaded
      failed_when: dns_reloaded.response.status | default('') | trim | lower != 'ok'
      when: dns_reconfigure_needed | bool or reapply_dns | bool

    - name: Apply the fully staged DNS-owned firewall configuration
      oxlorg.opnsense.raw:
        url: firewall/filter/apply
        action: post
        timeout: 120
      register: dns_firewall_applied
      failed_when: dns_firewall_applied.response.status | default('') | trim | lower != 'ok'
      when: dns_firewall_needed | bool or reapply_dns | bool

    - name: Check runtime service health independently of saved equality
      oxlorg.opnsense.raw:
        url: dnsmasq/service/status
        action: get
      register: dns_runtime_service
      changed_when: false
      failed_when: dns_runtime_service.response.status | default('') != ('running' if opnsense_dns_settings.enable == '1' else 'disabled')

    - name: Check selected actual DNS answers
      ansible.builtin.command:
        argv: [dig, '+short', '+time=3', '+tries=1', '@{{ item.server }}', '{{ item.name }}', A]
      loop: "{{ opnsense_dns_runtime_queries }}"
      register: dns_runtime_answer
      changed_when: false
      failed_when: dns_runtime_answer.rc != 0 or dns_runtime_answer.stdout_lines | sort != [item.answer]
      when: opnsense_dns_settings.enable == '1'

    - name: Record selected runtime checks, not full client acceptance
      ansible.builtin.set_fact:
        dns_runtime_verified: true
  rescue:
    - name: Report incomplete DNS activation without exposing responses
      ansible.builtin.fail:
        msg: Saved DNS may differ from runtime. Correct the failure, then retry with apply_dns=true reapply_dns=true. No ISC service was started.
      no_log: false
