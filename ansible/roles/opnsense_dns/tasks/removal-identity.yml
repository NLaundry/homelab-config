---
- name: Reject duplicate removals and desired-removal conflicts
  ansible.builtin.assert:
    that:
      - descriptions | length == descriptions | unique | length
      - descriptions | intersect(removal_group.desired) | length == 0
    fail_msg: A removal is repeated or conflicts with desired state; no writes occurred.
  vars:
    descriptions: "{{ removal_group.requested | map(attribute='description') | list }}"

- name: Require an exact managed description and unambiguous matching UUID
  ansible.builtin.assert:
    that:
      - item.description is match('^' ~ removal_group.prefix ~ '.+$')
      - matches | length <= 1
      - item.uuid is not defined or matches | length == 0 or matches[0].key == item.uuid
      - item.uuid is not defined or item.uuid not in removal_group.rows or removal_group.rows[item.uuid][removal_group.field] == item.description
    fail_msg: Removal identity is foreign, ambiguous or has a stale UUID; no writes occurred.
  loop: "{{ removal_group.requested }}"
  vars:
    matches: "{{ removal_group.rows | dict2items | selectattr('value.' ~ removal_group.field, 'equalto', item.description) | list }}"

- name: Add uniquely resolved removals and preserve every omitted row
  ansible.builtin.set_fact:
    dns_removal_plan: "{{ dns_removal_plan + [{'kind': removal_group.kind, 'uuid': matches[0].key, 'description': item.description}] }}"
  loop: "{{ removal_group.requested }}"
  vars:
    matches: "{{ removal_group.rows | dict2items | selectattr('value.' ~ removal_group.field, 'equalto', item.description) | list }}"
  when: matches | length == 1
