---
- name: Start an explicit UUID deletion plan
  ansible.builtin.set_fact:
    dns_removal_plan: []

- name: Resolve only explicitly requested owned identities
  ansible.builtin.include_tasks: removal-identity.yml
  loop:
    - kind: host
      requested: "{{ opnsense_dns_remove_hosts }}"
      desired: "{{ (opnsense_dns_reservations + opnsense_dns_shared_records + opnsense_dns_lease_holds) | map(attribute='description') | list }}"
      rows: "{{ dns_current.response.dnsmasq.hosts | default({}, true) }}"
      field: descr
      prefix: 'homelab:north_york:(host|lease):'
    - kind: range
      requested: "{{ opnsense_dns_remove_ranges }}"
      desired: "{{ opnsense_dns_ranges | map(attribute='description') | list }}"
      rows: "{{ dns_current.response.dnsmasq.dhcp_ranges | default({}, true) }}"
      field: description
      prefix: 'homelab:north_york:range:'
    - kind: domain
      requested: "{{ opnsense_dns_remove_domains }}"
      desired: "{{ opnsense_dns_domains | map(attribute='descr') | list }}"
      rows: "{{ dns_current.response.dnsmasq.domainoverrides | default({}, true) }}"
      field: descr
      prefix: 'homelab:north_york:domain:'
  loop_control:
    loop_var: removal_group

- name: Require lease reconciliation approval before retiring allocation protection
  ansible.builtin.assert:
    that: opnsense_dns_allocation_removal_approved is sameas true
    fail_msg: Reservation, hold and range retirement requires explicit approval after reconciling both current and old lease obligations.
  loop: "{{ dns_removal_plan }}"
  when: item.kind == 'range' or (item.kind == 'host' and ((dns_existing_hosts | selectattr('uuid', 'equalto', item.uuid) | first).hwaddr | length > 0 or (dns_existing_hosts | selectattr('uuid', 'equalto', item.uuid) | first).client_id | default('') | length > 0))

- name: Bound range retirement to the owned IPv4 internal allocation model
  ansible.builtin.assert:
    that:
      - row.start_addr is match('^10\\.10\\.(10|20)\\.[0-9]+$')
      - row.end_addr is match('^10\\.10\\.(10|20)\\.[0-9]+$')
      - row.start_addr.rsplit('.', 1)[0] == row.end_addr.rsplit('.', 1)[0]
  loop: "{{ dns_removal_plan | selectattr('kind', 'equalto', 'range') | list }}"
  vars:
    row: "{{ dns_current.response.dnsmasq.dhcp_ranges[item.uuid] }}"

# Current allocations, not the retired ISC migration snapshot. Treat every
# returned lease as protected (including an expired row awaiting reconciliation).
- name: Read current Dnsmasq allocations before changing address ownership
  oxlorg.opnsense.raw:
    url: dnsmasq/leases/search
    action: get
  register: dns_allocations
  changed_when: false

- name: Require a complete current allocation inventory
  ansible.builtin.assert:
    that:
      - dns_allocations.response.rows | length == dns_allocations.response.total | int
    fail_msg: Current allocation inventory is incomplete; no writes are safe.

- name: Reject managed addresses that belong to a different live client
  ansible.builtin.assert:
    that:
      - item.1.hwaddr | lower in (item.0.hwaddr | map('lower') | list)
    fail_msg: A desired address is leased to a different client; reconcile allocations before writing.
  loop: "{{ dns_hosts | product(dns_allocations.response.rows) | list }}"
  when: item.1.address in item.0.ip

- name: Protect allocated hosts and ranges from explicit deletion
  ansible.builtin.assert:
    that:
      - not (allocated | bool)
    fail_msg: Explicit removal intersects a current allocation; reconcile leases before removal.
  loop: "{{ dns_removal_plan | product(dns_allocations.response.rows) | list }}"
  vars:
    allocated: >-
      {%- if item.0.kind == 'host' -%}
      {{ item.1.address in (dns_existing_hosts | selectattr('uuid', 'equalto', item.0.uuid) | first).ip }}
      {%- elif item.0.kind == 'range' -%}
      {%- set row = dns_current.response.dnsmasq.dhcp_ranges[item.0.uuid] -%}
      {{ ':' not in item.1.address and item.1.address.rsplit('.', 1)[0] == row.start_addr.rsplit('.', 1)[0] and row.start_addr.split('.')[-1] | int <= item.1.address.split('.')[-1] | int <= row.end_addr.split('.')[-1] | int }}
      {%- else -%}false{%- endif -%}
