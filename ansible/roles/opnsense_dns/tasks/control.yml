---
# Keep hostname/SNI and CA verification while connecting directly through a
# DNS outage. Auth stays on stdin; ignore curlrc and proxies. HTTP/1.1 matches
# the working collection transport. GET requests must carry neither a JSON
# body nor Content-Type: application/json (this router rejects the latter).
- name: "DNS handoff API — {{ dns_control.path }}"
  ansible.builtin.command:
    argv: "{{ dns_control_argv + (['--data-binary', dns_control.data | default({}) | to_json] if dns_control.method | default('POST') == 'POST' else []) }}"
    stdin: |
      header = "Authorization: Basic {{ (opnsense_api_key ~ ':' ~ opnsense_api_secret) | b64encode }}"
      {% if dns_control.method | default('POST') == 'POST' %}
      header = "Content-Type: application/json"
      {% endif %}
  vars:
    dns_control_argv:
      - curl
      - --disable
      - --noproxy
      - '*'
      - --http1.1
      - --silent
      - --show-error
      - --fail-with-body
      - --connect-timeout
      - '5'
      - --max-time
      - '120'
      - --resolve
      - "{{ opnsense_selected.hostname }}:{{ opnsense_selected.port }}:{{ opnsense_selected.recovery_address }}"
      - --cacert
      - "{{ opnsense_ca_file }}"
      - --config
      - '-'
      - --request
      - "{{ dns_control.method | default('POST') }}"
      - "https://{{ opnsense_selected.hostname }}:{{ opnsense_selected.port }}/api/{{ dns_control.path }}"
  register: dns_control_result
  changed_when: dns_control.method | default('POST') == 'POST'
  failed_when: >-
    dns_control_result.rc != 0 or
    ((dns_control_result.stdout | from_json)[dns_control.field] | string | trim | lower not in
      (dns_control.expected_values | default([dns_control.expected | default('')]) | map('lower') | list))
  no_log: true
