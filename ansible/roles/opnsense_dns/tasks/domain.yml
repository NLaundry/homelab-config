---
- name: Require an unambiguous domain identity without unowned overlaps
  ansible.builtin.assert:
    that:
      - matches | length <= 1
      - conflicts | length == 0
  vars:
    matches: "{{ dns_domain_search.response.rows | selectattr('descr', 'equalto', dns_domain.descr) | list }}"
    conflicts: >-
      {%- set rows = [] -%}
      {%- for row in dns_domain_search.response.rows + opnsense_dns_domains -%}
      {%- if row.domain | lower == dns_domain.domain | lower and row.descr != dns_domain.descr -%}
      {%- if row.descr not in (opnsense_dns_domains | map(attribute='descr') | list) or row.ip == dns_domain.ip -%}
      {%- set _ = rows.append(row) -%}
      {%- endif -%}{%- endif -%}{%- endfor -%}
      {{ rows }}

- name: Read the domain's actual scalar fields, not grid display values
  oxlorg.opnsense.raw:
    url: "dnsmasq/settings/get_domain{{ '/' ~ matches[0].uuid if matches else '' }}"
    action: get
  vars:
    matches: "{{ dns_domain_search.response.rows | selectattr('descr', 'equalto', dns_domain.descr) | list }}"
  register: dns_domain_current
  changed_when: false

- name: Check the UUID still belongs to the managed description
  ansible.builtin.assert:
    that: dns_domain_current.response.domainoverride.descr == dns_domain.descr
  when: dns_domain_search.response.rows | selectattr('descr', 'equalto', dns_domain.descr) | list | length > 0

- name: Accumulate a partial-field UUID-addressed domain plan
  ansible.builtin.set_fact:
    dns_domain_plan: "{{ dns_domain_plan + [{'uuid': matches[0].uuid if matches else '', 'desired': dns_domain, 'changed': differs | bool}] }}"
  vars:
    matches: "{{ dns_domain_search.response.rows | selectattr('descr', 'equalto', dns_domain.descr) | list }}"
    differs: >-
      {%- set ns = namespace(changed=(matches | length == 0)) -%}
      {%- for key, value in dns_domain.items() -%}
      {%- if dns_domain_current.response.domainoverride[key] | string != value | string -%}
      {%- set ns.changed = true -%}
      {%- endif -%}{%- endfor -%}
      {{ ns.changed }}
