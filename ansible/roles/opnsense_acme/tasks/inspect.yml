---
- name: Read ACME configuration using Services ACME Client access
  oxlorg.opnsense.raw:
    url: acmeclient/settings/get
    action: get
  register: acme_model
  changed_when: false

- name: Read native jobs using System Settings Cron access
  oxlorg.opnsense.raw:
    url: cron/settings/get
    action: get
  register: acme_jobs
  changed_when: false

- name: Plan only uniquely identified existing native objects
  ansible.builtin.set_fact:
    acme_plan: "{{ acme_model.response | opnsense_acme_plan(acme_jobs.response, opnsense_acme) }}"
