---
- name: Validate local OPNsense credential wiring
  hosts: opnsense
  connection: local
  gather_facts: false
  become: false
  no_log: true

  vars:
    ansible_pipelining: true
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    opnsense_auth_check: false

  module_defaults:
    group/oxlorg.opnsense.all: "{{ opnsense_module_defaults }}"

  pre_tasks:
    - ansible.builtin.import_tasks: ../tasks/opnsense-connection.yml

  tasks:
    - name: Read NetBird plugin status
      oxlorg.opnsense.raw:
        url: netbird/status/status
        action: get
      check_mode: true
      changed_when: false
      register: opnsense_peer
      when: opnsense_auth_check | bool

    - name: Require the selected NetBird peer to be connected
      ansible.builtin.assert:
        that: opnsense_peer.response.management.connected is sameas true
      when: opnsense_auth_check | bool
