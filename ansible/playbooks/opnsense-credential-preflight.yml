---
- name: Validate local OPNsense credential wiring
  hosts: opnsense
  connection: local
  gather_facts: false
  become: false
  no_log: true

  vars:
    ansible_pipelining: true
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    opnsense_url: "{{ lookup('ansible.builtin.env', 'OPNSENSE_URL') }}"
    opnsense_api_key: "{{ lookup('ansible.builtin.env', 'OPNSENSE_API_KEY') }}"
    opnsense_api_secret: "{{ lookup('ansible.builtin.env', 'OPNSENSE_API_SECRET') }}"
    opnsense_auth_check: false
    opnsense_ca_file: "{{ playbook_dir }}/../certificates/north-york-opnsense-web.pem"

  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_url | ansible.builtin.urlsplit('hostname') }}"
      api_port: "{{ (opnsense_url | ansible.builtin.urlsplit('port')) | default(443, true) }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: true
      ssl_ca_file: "{{ opnsense_ca_file }}"
      debug: false
      profiling: false

  pre_tasks:
    - name: Require bounded HTTPS inputs
      ansible.builtin.assert:
        that:
          - (opnsense_url | ansible.builtin.urlsplit('scheme')) == 'https'
          - (opnsense_url | ansible.builtin.urlsplit('hostname') | length) > 0
          - (opnsense_api_key | length) > 0
          - (opnsense_api_secret | length) > 0

  tasks:
    - name: Read NetBird plugin status
      oxlorg.opnsense.raw:
        url: netbird/status/status
        action: get
      check_mode: true
      changed_when: false
      when: opnsense_auth_check | bool
