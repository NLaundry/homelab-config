---
- name: Preflight North York NetBird enrollment
  hosts: opnsense
  gather_facts: false
  connection: local
  no_log: true
  vars:
    ansible_pipelining: true
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    opnsense_url: "{{ lookup('ansible.builtin.env', 'OPNSENSE_URL') }}"
    opnsense_api_key: "{{ lookup('ansible.builtin.env', 'OPNSENSE_API_KEY') }}"
    opnsense_api_secret: "{{ lookup('ansible.builtin.env', 'OPNSENSE_API_SECRET') }}"
    opnsense_ca_file: "{{ playbook_dir }}/../certificates/north-york-opnsense-web.pem"
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ opnsense_url | regex_replace('^https://', '') }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: true
      ssl_ca_file: "{{ opnsense_ca_file }}"
      debug: false
  pre_tasks:
    - name: Require bounded HTTPS inputs
      ansible.builtin.assert:
        that:
          - opnsense_url is match('^https://[^/]+$')
          - opnsense_api_key | length > 0
          - opnsense_api_secret | length > 0

  tasks:
    - name: Read NetBird settings API
      oxlorg.opnsense.raw:
        url: netbird/settings/get
        action: get
      check_mode: true
      changed_when: false
      register: netbird_settings

    - name: Read NetBird authentication API
      oxlorg.opnsense.raw:
        url: netbird/authentication/get
        action: get
      check_mode: true
      changed_when: false
      register: netbird_authentication

    - name: Read NetBird service API
      oxlorg.opnsense.raw:
        url: netbird/service/status
        action: get
      check_mode: true
      changed_when: false
      register: netbird_service

    - name: Read NetBird status API
      oxlorg.opnsense.raw:
        url: netbird/status/status
        action: get
      check_mode: true
      changed_when: false
      register: netbird_status

    - name: Require every NetBird API response
      ansible.builtin.assert:
        that:
          - netbird_settings.response is mapping
          - netbird_authentication.response is mapping
          - netbird_service.response is mapping
          - netbird_status.response is mapping or netbird_status.response == []
